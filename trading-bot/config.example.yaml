# Copy to config.yaml and adjust. Nothing here is a credential — this bot
# never holds an exchange API key or places real orders (see README.md).

exchange: kraken       # any ccxt exchange id with public OHLCV (no key needed)
symbol: "BTC/USD"
timeframe: "1h"

strategy: sma_crossover
params:
  fast_window: 10
  slow_window: 50

backtest:
  initial_cash: 10000.0
  fee_rate: 0.001        # 0.1% per side, adjust to your exchange's taker fee
  slippage_rate: 0.0005  # 0.05% per side: spread/impact on market orders

optimize:
  n_splits: 4
  min_trades: 5          # candidates with fewer trades in a fold score -inf

self_improve:
  history_candles: 720           # 30 days; chosen by `holdout` on 2025-10..2026-05, confirmed on 2026-06..09
  step_seconds: 3600             # trade decision every bar (1h)
  reoptimize_every: 24           # re-optimize every 24 bars (once per day)
  n_splits: 3
  min_trades: 3                  # per walk-forward fold (240 bars each at the defaults)
  min_walk_forward_score: 0.0    # candidate must be OOS-profitable (risk-adjusted)
  min_improvement_margin: 0.05   # ...and beat the re-scored incumbent by this much, or don't switch
