# Copy to config.yaml and adjust. Nothing here is a credential — this bot
# never holds an exchange API key or places real orders (see README.md).

exchange: kraken       # any ccxt exchange id with public OHLCV (no key needed)
symbol: "BTC/USD"
timeframe: "1h"

strategy: sma_crossover_ls   # margin long/short at 1x; chosen by `holdout` (README "7")
params:
  fast_window: 10
  slow_window: 50
  band: 0.0

backtest:
  initial_cash: 10000.0
  fee_rate: 0.0002             # 0.02% per side (limit / maker)
  slippage_rate: 0.0           # limit orders: no slippage, but some orders go unfilled
  order_type: limit            # fills only if the next bar trades through the decision close
  carry_rate_per_day: 0.0004   # margin carry on open positions, long or short (to be confirmed per exchange)

optimize:
  n_splits: 4
  min_trades: 5          # candidates with fewer trades in a fold score -inf
  score: sharpe          # or "return" (annualized mean return)

self_improve:
  history_candles: 720           # 30 days; chosen by `holdout` on 2025-10..2026-05, confirmed on 2026-06..09
  step_seconds: 3600             # trade decision every bar (1h)
  reoptimize_every: 24           # re-optimize every 24 bars (once per day)
  n_splits: 3
  min_trades: 5                  # per walk-forward fold (240 bars each at the defaults)
  score: sharpe
  min_walk_forward_score: 0.0    # candidate must be OOS-profitable
  min_improvement_margin: 0.05   # ...and beat the re-scored incumbent by this much, or don't switch
