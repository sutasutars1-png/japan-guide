name: Refresh spots data

# 手動実行（Actionsタブの「Run workflow」）＋毎週の自動更新。
# GitHubランナーは外部ネットに出られるので ingest_fun.py（OSM/Overpass＋千葉市OD）が動く。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"  # 毎週月曜 05:00 JST (日曜20:00 UTC)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kosodate-makuhari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ingest_fun.py (OSM + Chiba OD)
        run: python ingest/ingest_fun.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/spots.json"))
          print("spots:", len(d))
          assert len(d) >= 50, f"too few spots ({len(d)}); aborting to protect live data"
          assert all(k in d[0] for k in ("id","name","cat","lat","lng")), "schema check failed"
          PY

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/spots.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/spots.json
            git commit -m "Refresh data/spots.json via ingest_fun.py (OSM + Chiba OD)"
            git push
            echo "Committed refreshed data."
          else
            echo "No changes in data/spots.json."
          fi
